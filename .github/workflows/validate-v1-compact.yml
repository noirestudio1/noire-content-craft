name: Validate V1 Compact RO-EN
on:
  push:
    branches: [sans-retour-v1-compact-ro-en]
  pull_request:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
